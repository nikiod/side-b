<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIDE B</title>
  </head>
  <body>
    <div id="app">
      <div id="scene-root" class="scene-root"></div>
      <div id="flash-layer" class="flash-layer" aria-hidden="true"></div>
      <button type="button" id="reset-progress" class="reset-progress">
        Reset Progress
      </button>
    </div>

    <template id="tpl-record-desk">
      <section class="scene scene-desk" data-scene="desk">
        <div class="night-grain" aria-hidden="true"></div>
        <div class="lamp-wash" aria-hidden="true"></div>

        <div class="desk-surface">
          <div class="desk-lamp-pool" aria-hidden="true"></div>
          <div class="desk-dim" aria-hidden="true"></div>

          <div class="desk-object cup-stain" aria-hidden="true"></div>

          <div class="desk-object polaroid-peek" aria-hidden="true">
            <img class="peek-photo" alt="" draggable="false" />
          </div>

          <div class="desk-object ticket-stub" aria-hidden="true">
            <span class="ticket-notch"></span>
            <span class="ticket-perf"></span>
            <span class="ticket-rules"></span>
            <span class="ticket-serial">0047</span>
          </div>

          <div class="desk-object booklet-bundle">
            <span class="sheet-back" aria-hidden="true"></span>
            <button type="button" class="booklet-cover-hit" aria-label="booklet">
              <span class="booklet-spine"></span>
              <span class="booklet-cover"></span>
            </button>
            <article class="track-sheet" aria-hidden="true">
              <header class="track-sheet-head">
                <p class="side-mark">SIDE B</p>
              </header>
              <ol class="track-list"></ol>
              <button type="button" class="booklet-enter" aria-label="CONTINUE">CONTINUE</button>
            </article>
          </div>

          <button type="button" class="desk-object case-hit" aria-label="SIDE B">
            <img class="case-art" alt="" draggable="false" />
          </button>
        </div>
      </section>
    </template>

    <template id="tpl-prologue">
      <section class="scene scene-booklet" data-scene="prologue">
        <div class="night-grain" aria-hidden="true"></div>
        <div class="lamp-wash" aria-hidden="true"></div>
        <div class="desk-surface desk-surface-quiet" aria-hidden="true"></div>
        <div class="booklet-stage">
          <article class="booklet-spread" data-page="0">
            <div class="paper-page page-photo">
              <button type="button" class="polaroid-hit" aria-label="photo">
                <span class="polaroid-slot">
                  <img class="polaroid-photo" alt="" draggable="false" />
                </span>
              </button>
            </div>
            <div class="paper-page page-notes">
              <div class="notes-body"></div>
              <button type="button" class="page-turn" aria-label="turn page">
                <span class="page-ear" aria-hidden="true"></span>
              </button>
            </div>
          </article>
        </div>
      </section>
    </template>

    <template id="tpl-track-intro">
      <section class="scene scene-intro" data-scene="track-intro">
        <div class="night-grain" aria-hidden="true"></div>
        <div class="intro-copy">
          <p class="intro-kicker">TRACK 01</p>
          <h1 class="intro-title">一天</h1>
          <p class="intro-date" aria-hidden="true">····</p>
          <button type="button" class="intro-continue" disabled>CONTINUE</button>
        </div>
      </section>
    </template>

    <template id="tpl-track-02">
      <section class="scene scene-track02" data-scene="track-02" data-beat="sparseContact">
        <div class="sparse-plate" aria-hidden="true">
          <div class="sparse-plate-image"></div>
          <div class="sparse-plate-veil"></div>
        </div>
        <div class="night-grain" aria-hidden="true"></div>
        <div class="track02-field" aria-hidden="true">
          <span class="track02-reg is-tl"></span>
          <span class="track02-reg is-tr"></span>
          <span class="track02-reg is-bl"></span>
          <span class="track02-reg is-br"></span>
          <div class="track02-scale"></div>
          <p class="track02-catalog"><span>02</span><span>SPARSE CONTACT</span></p>
        </div>
        <div class="sparse" aria-hidden="true">
          <div class="sparse-rail" aria-hidden="true">
            <span class="sparse-rail-line"></span>
          </div>
          <div class="sparse-scraps"></div>
          <p class="sparse-coda"></p>
        </div>
        <div class="now-like-this" aria-hidden="true"></div>
        <div class="jazz-cd" hidden>
          <button type="button" class="jazz-cd-hit" disabled>
            <img class="jazz-cd-art" alt="" draggable="false" />
          </button>
          <p class="jazz-cd-notes"></p>
        </div>
      </section>
    </template>

    <template id="tpl-track-01">
      <section class="scene scene-track01" data-scene="track-01" data-beat="afternoon">
        <div class="meeting-plate" aria-hidden="true">
          <div class="meeting-plate-image"></div>
          <div class="meeting-plate-veil"></div>
        </div>
        <div class="noodle-plate" aria-hidden="true">
          <div class="noodle-plate-image"></div>
          <div class="noodle-plate-veil"></div>
        </div>
        <div class="noodle-interior-plate" aria-hidden="true">
          <div class="noodle-interior-image"></div>
          <div class="noodle-interior-veil"></div>
        </div>
        <div class="exhibit-plate" aria-hidden="true">
          <div class="exhibit-plate-image"></div>
          <div class="exhibit-plate-veil"></div>
        </div>
        <div class="cinema-plate" aria-hidden="true">
          <div class="cinema-plate-image"></div>
          <div class="cinema-plate-veil"></div>
        </div>
        <div class="dinner-plate" aria-hidden="true">
          <div class="dinner-plate-image"></div>
          <div class="dinner-plate-veil"></div>
        </div>
        <div class="night-grain" aria-hidden="true"></div>
        <div class="track01-stage">
          <button type="button" class="phone" aria-label="许遥">
            <p class="phone-from"></p>
            <div class="phone-lines"></div>
            <span class="phone-reply" hidden>马上。</span>
          </button>
          <div class="meeting" aria-hidden="true">
            <div class="meeting-lines"></div>
          </div>
          <div class="route" aria-hidden="true">
            <p class="route-title">今天</p>
            <div class="route-line" aria-hidden="true"></div>
            <div class="route-slots"></div>
            <div class="scrap-pile"></div>
            <p class="route-note" hidden></p>
          </div>
          <div class="noodle-entrance" aria-hidden="true">
            <div class="noodle-lines"></div>
          </div>
          <div class="noodle-interior" aria-hidden="true">
            <div class="interior-lines"></div>
            <div class="interior-choices" hidden></div>
            <button type="button" class="interior-hint" hidden>走吧。</button>
          </div>
          <div class="exhibit-hall" aria-hidden="true">
            <div class="exhibit-hotspots"></div>
            <button type="button" class="exhibit-hint" hidden>继续逛</button>
            <div class="exhibit-view" hidden>
              <img class="exhibit-large" alt="" draggable="false" />
              <div class="exhibit-view-lines"></div>
            </div>
          </div>
          <div class="cinema" aria-hidden="true">
            <p class="cinema-note" hidden>
              <span class="cinema-time"></span>
              <span class="cinema-caption"></span>
            </p>
          </div>
          <div class="dinner" aria-hidden="true">
            <div class="dinner-lines"></div>
            <div class="dinner-choices" hidden></div>
            <p class="dinner-cue" hidden>拍一张？</p>
          </div>
          <div class="day-polaroid" hidden>
            <button type="button" class="day-polaroid-hit" disabled>
              <img class="day-polaroid-photo" alt="" draggable="false" />
            </button>
            <p class="day-polaroid-notes">
              <span class="day-polaroid-line" hidden></span>
              <span class="day-polaroid-line" hidden></span>
            </p>
          </div>
        </div>
      </section>
    </template>

    <template id="tpl-track-03">
      <section class="scene scene-track03" data-scene="track-03" data-beat="opening">
        <div class="t03-open-plate" aria-hidden="true">
          <div class="t03-open-image"></div>
          <div class="t03-open-veil"></div>
        </div>
        <div class="night-grain" aria-hidden="true"></div>
        <div class="t03-opening">
          <div class="t03-open-title">
            <p class="intro-kicker">TRACK 03</p>
            <h1 class="intro-title">晚安曲</h1>
          </div>
          <div class="t03-open-copy"></div>
        </div>
        <div class="t03-montage" hidden></div>
        <div class="t03-ghosts" aria-hidden="true"></div>
        <button type="button" class="t03-still-hit" hidden>
          <img class="t03-still-art" alt="" draggable="false" />
        </button>
        <div class="t03-lines"></div>
        <div class="t03-coda">
          <p class="t03-coda-kicker">TRACK 03</p>
          <h1 class="t03-coda-title">晚安曲</h1>
          <p class="t03-coda-line">有些距离，<br />是慢慢变近的。</p>
          <button type="button" class="t03-back" hidden>BACK TO TRACK LIST</button>
        </div>
      </section>
    </template>

    <template id="tpl-track-04">
      <section class="scene scene-track04" data-scene="track-04" data-beat="opening">
        <div class="t04-open-plate" aria-hidden="true">
          <div class="t04-open-image"></div>
          <div class="t04-open-veil"></div>
        </div>
        <div class="night-grain" aria-hidden="true"></div>
        <div class="t04-opening">
          <div class="t04-open-title">
            <p class="intro-kicker">TRACK 04</p>
            <h1 class="intro-title">生活题</h1>
          </div>
          <div class="t04-open-copy"></div>
        </div>
        <div class="t04-planner" hidden>
          <div class="t04-planner-paper">
            <p class="t04-planner-head">WEEK PLANNER</p>
            <div class="t04-week"></div>
            <div class="t04-tray"></div>
            <div class="t04-float" aria-hidden="true"></div>
          </div>
          <p class="t04-plan-note" hidden></p>
        </div>
        <button type="button" class="t04-still-hit" hidden>
          <span class="t04-still-frame">
            <img class="t04-still-art" alt="" draggable="false" />
          </span>
        </button>
        <div class="t04-lines"></div>
        <div class="t04-coda">
          <p class="t04-coda-kicker">TRACK 04</p>
          <h1 class="t04-coda-title">生活题</h1>
          <p class="t04-coda-line">有些东西，<br />当时没有放进去。</p>
          <button type="button" class="t04-back" hidden>BACK TO TRACK LIST</button>
        </div>
      </section>
    </template>

    <template id="tpl-track-05">
      <section class="scene scene-track05" data-scene="track-05" data-beat="opening">
        <div class="t05-open-plate" aria-hidden="true">
          <div class="t05-open-image"></div>
          <div class="t05-open-veil"></div>
        </div>
        <div class="night-grain" aria-hidden="true"></div>
        <div class="t05-opening">
          <div class="t05-open-title">
            <p class="intro-kicker">TRACK 05</p>
            <h1 class="intro-title">附近</h1>
          </div>
          <div class="t05-open-copy"></div>
        </div>
        <div class="t05-city" hidden>
          <div class="t05-map">
            <span class="t05-dot is-xu"></span>
            <span class="t05-dot is-lin"></span>
            <div class="t05-places"></div>
          </div>
          <button type="button" class="t05-hold" hidden aria-label="按住"></button>
          <p class="t05-hold-hint" hidden>按住。</p>
        </div>
        <button type="button" class="t05-still-hit" hidden>
          <span class="t05-still-frame">
            <img class="t05-still-art" alt="" draggable="false" />
            <span class="t05-candies" aria-hidden="true"></span>
          </span>
        </button>
        <div class="t05-lines"></div>
        <div class="t05-coda">
          <p class="t05-coda-kicker">TRACK 05</p>
          <h1 class="t05-coda-title">附近</h1>
          <button type="button" class="t05-back" hidden>BACK TO TRACK LIST</button>
        </div>
      </section>
    </template>

    <template id="tpl-track-06">
      <section class="scene scene-track06" data-scene="track-06" data-beat="opening">
        <div class="t06-open-plate" aria-hidden="true">
          <div class="t06-open-image"></div>
          <div class="t06-open-veil"></div>
        </div>
        <div class="night-grain" aria-hidden="true"></div>
        <div class="t06-opening">
          <div class="t06-open-title">
            <p class="intro-kicker">TRACK 06</p>
            <h1 class="intro-title">电脑</h1>
          </div>
          <div class="t06-open-copy"></div>
        </div>
        <div class="t06-desk" hidden>
          <div class="t06-desktop">
            <header class="t06-menubar">
              <span>SIDE B</span>
              <span>Archive</span>
              <span>View</span>
              <span class="t06-menubar-end">
                <span class="t06-link-line"></span>
                <span class="t06-link-label"></span>
                <span class="t06-clock">00:17</span>
              </span>
            </header>
            <div class="t06-board">
              <div class="t06-files"></div>
              <div class="t06-windows"></div>
            </div>
            <div class="t06-tabs" hidden></div>
            <div class="t06-restore" hidden>
              <p class="t06-restore-name">UNTITLED</p>
              <button type="button" class="t06-restore-hit">RESTORE</button>
              <p class="t06-restore-pct">0%</p>
              <p class="t06-restore-status"></p>
            </div>
          </div>
        </div>
        <div class="t06-reconnect" hidden>
          <div class="t06-reconnect-plate">
            <img
              class="t06-reconnect-art"
              src="%BASE_URL%canon/track06-reconnected.png"
              alt=""
              draggable="false"
            />
          </div>
          <div class="t06-frags"></div>
          <div class="t06-current" hidden>
            <button type="button" class="t06-current-hit">CURRENT</button>
            <div class="t06-tags" hidden></div>
          </div>
        </div>
        <button type="button" class="t06-still-hit" hidden>
          <span class="t06-still-frame">
            <img class="t06-still-art" alt="" draggable="false" />
          </span>
        </button>
        <div class="t06-lines"></div>
        <div class="t06-coda">
          <p class="t06-coda-kicker">TRACK 06</p>
          <h1 class="t06-coda-title">电脑</h1>
          <button type="button" class="t06-back" hidden>BACK TO TRACK LIST</button>
        </div>
      </section>
    </template>

    <template id="tpl-track-07">
      <section class="scene scene-track07" data-scene="track-07" data-beat="opening">
        <div class="night-grain" aria-hidden="true"></div>
        <div class="t07-opening">
          <div class="t07-open-title">
            <p class="intro-kicker">TRACK 07</p>
            <h1 class="intro-title">各自生活</h1>
          </div>
          <div class="t07-open-copy"></div>
        </div>
        <div class="t07-sides" hidden>
          <p class="t07-name is-xu">许遥</p>
          <p class="t07-name is-lin">林禾</p>
          <div class="t07-rail"><span class="t07-trace"></span></div>
          <p class="t07-origin-tick" aria-hidden="true">00</p>
          <div class="t07-field"></div>
          <p class="t07-hint">
            <span class="t07-hint-label">SCROLL / DRAG</span>
            <span class="t07-hint-arrow">↓</span>
          </p>
          <p class="t07-click-hint" hidden>
            <span class="t07-hint-label">CLICK</span>
            <span class="t07-hint-arrow">↓</span>
          </p>
          <button type="button" class="t07-clip" hidden>
            <div class="t07-clip-frame">
              <img class="t07-clip-art" alt="" draggable="false" />
              <p class="t07-clip-note"></p>
            </div>
          </button>
          <button type="button" class="t07-slip" hidden>
            <p class="t07-slip-kicker"></p>
            <div class="t07-slip-copy"></div>
          </button>
        </div>
        <button type="button" class="t07-still-hit" hidden>
          <span class="t07-still-frame">
            <img class="t07-still-art" alt="" draggable="false" />
          </span>
        </button>
        <button type="button" class="t07-msg" hidden>● NEW MESSAGE</button>
        <div class="t07-lines"></div>
        <div class="t07-coda">
          <p class="t07-coda-kicker">TRACK 07</p>
          <h1 class="t07-coda-title">各自生活</h1>
          <button type="button" class="t07-back" hidden>BACK TO TRACK LIST</button>
        </div>
      </section>
    </template>

    <template id="tpl-track-08">
      <section class="scene scene-track08" data-scene="track-08" data-phase="opening">
        <div class="night-grain" aria-hidden="true"></div>
        <div class="t08-opening">
          <div class="t08-open-still">
            <img class="t08-open-art" alt="" hidden draggable="false" />
          </div>
          <div class="t08-open-title">
            <p class="intro-kicker">TRACK 08</p>
            <h1 class="intro-title">回来以后</h1>
          </div>
        </div>
        <button type="button" class="t08-msg" hidden>● NEW MESSAGE</button>
        <div class="t08-journal" hidden>
          <p class="t08-journal-title">TODAY</p>
          <div class="t08-journal-body"></div>
          <div class="t08-today-detail" hidden>
            <div class="t08-today-detail-inner"></div>
          </div>
          <button type="button" class="t08-journal-turn" hidden>下一页 →</button>
        </div>
        <section class="t08-daily-life" hidden>
          <div class="t08-daily-wrap">
            <img class="t08-daily-art" alt="" draggable="false" />
          </div>
          <button type="button" class="t08-daily-continue">继续 →</button>
        </section>
        <section class="t08-home" hidden>
          <div class="track08-home-media">
            <img class="track08-home-image" alt="" draggable="false" />
            <div class="home-copy">
              <div class="t08-home-caption">
                <span>回来的时候，</span>
                <span>饭已经做好了。</span>
              </div>
              <div class="t08-home-note" hidden></div>
              <button type="button" class="t08-home-continue" hidden>继续 →</button>
            </div>
          </div>
        </section>
        <section class="t08-night" hidden>
          <div class="t08-night-wrap">
            <img class="t08-night-art" alt="" draggable="false" />
          </div>
        </section>
        <div class="t08-lines"></div>
        <div class="t08-coda">
          <p class="t08-coda-kicker">TRACK 08</p>
          <h1 class="t08-coda-title">回来以后</h1>
          <button type="button" class="t08-back" hidden>BACK TO TRACK LIST</button>
        </div>
      </section>
    </template>

    <template id="tpl-track-09">
      <section class="scene scene-track09" data-scene="track-09" data-phase="opening" data-step="title">
        <div class="night-grain" aria-hidden="true"></div>
        <div class="t09-opening">
          <p class="t09-kicker">TRACK 09</p>
          <div class="t09-now" hidden>
            <p class="t09-now-title">SIDE B</p>
            <p class="t09-now-sub">NOW PLAYING</p>
          </div>
        </div>
        <section class="t09-choice" hidden>
          <img class="t09-choice-art" alt="" hidden draggable="false" />
          <div class="t09-choice-fallback" aria-hidden="true"></div>
          <p class="t09-choose-label">CHOOSE THE NEXT TRACK</p>
          <div class="t09-tracks">
            <button type="button" class="t09-track" data-choice="NIGHT WALK">NIGHT WALK</button>
            <button type="button" class="t09-track" data-choice="LATE SNACK">LATE SNACK</button>
            <button type="button" class="t09-track" data-choice="00:07">00:07</button>
            <button type="button" class="t09-track" data-choice="HOME">HOME</button>
          </div>
        </section>
        <section class="t09-walk track09-scene" hidden>
          <div class="track09-stage">
            <div class="track09-media">
              <img class="t09-walk-art" alt="" draggable="false" />
              <span class="t09-ripple" aria-hidden="true"></span>
              <button type="button" class="night-hotspot is-tree" data-env="tree"><span>树</span></button>
              <button type="button" class="night-hotspot is-bird" data-env="bird"><span>鸟</span></button>
              <button type="button" class="night-hotspot is-water" data-env="river"><span>河面</span></button>
              <p class="t09-whisper" hidden></p>
            </div>
            <div class="track09-copy">
              <p class="t09-copy-line" hidden></p>
              <button type="button" class="t09-forward" hidden>继续 →</button>
            </div>
          </div>
        </section>
        <section class="t09-snack track09-scene" hidden>
          <div class="track09-stage">
            <div class="track09-media">
              <img class="t09-snack-art" alt="" draggable="false" />
              <button type="button" class="t09-dish">食物</button>
            </div>
            <div class="track09-copy">
              <p class="t09-copy-line" hidden></p>
              <div class="t09-snack-picks">
                <button type="button" class="t09-food-pick" data-food="hot">热的</button>
                <button type="button" class="t09-food-pick" data-food="cold">凉的</button>
              </div>
            </div>
          </div>
        </section>
        <section class="t09-zero" hidden>
          <button type="button" class="t09-clock">00:07</button>
          <div class="t09-zero-copy"></div>
        </section>
        <section class="t09-home track09-scene" hidden>
          <div class="track09-stage">
            <div class="track09-media">
              <img class="t09-home-art" alt="" draggable="false" />
              <span class="t09-warm" aria-hidden="true"></span>
              <button type="button" class="t09-spot t09-door">门</button>
              <button type="button" class="t09-spot t09-lamp" hidden>灯</button>
              <button type="button" class="t09-spot t09-cat" hidden>布总</button>
            </div>
            <div class="track09-copy">
              <p class="t09-copy-line" hidden></p>
              <button type="button" class="t09-home-next" hidden>继续 →</button>
            </div>
          </div>
        </section>
        <section class="t09-ending track09-scene" hidden>
